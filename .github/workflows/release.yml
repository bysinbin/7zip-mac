name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release macOS 7-Zip
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application Bundle
        run: |
          chmod +x ./scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Create ZIP and DMG Artifacts
        run: |
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent "7-Zip.app" "7-Zip-macOS.zip"
          hdiutil create -volname "7-Zip" -srcfolder "7-Zip.app" -ov -format UDZO "7-Zip-macOS.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "7-Zip for macOS ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/bin/7-Zip-macOS.dmg
            build/bin/7-Zip-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
